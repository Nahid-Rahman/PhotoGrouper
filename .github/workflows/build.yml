name: Build Windows app

on:
  push:
    tags: ["v*"]        # push a tag like v1.0.0 to publish a release
  workflow_dispatch:    # or run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller -r requirements.txt -r requirements-optional.txt

      - name: Check that the engine imports
        run: python -c "import sys; sys.path.insert(0, 'src'); import grouper_core as c; print('Photo Grouper', c.__version__, 'HEIC:', c.HEIF, 'RAW:', c.RAW)"

      - name: Build PhotoGrouper.exe
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed --name PhotoGrouper
          --icon assets/icon.ico --add-data "assets/icon.ico;." --paths src
          --collect-binaries onnxruntime --collect-binaries pillow_heif --collect-binaries rawpy
          src/photo_grouper.py

      - uses: actions/upload-artifact@v4
        with:
          name: PhotoGrouper
          path: dist/PhotoGrouper.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PhotoGrouper.exe
          generate_release_notes: true
